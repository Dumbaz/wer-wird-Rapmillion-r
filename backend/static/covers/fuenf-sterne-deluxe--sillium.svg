      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#ff5f00"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="135.2" cy="245.6" r="166.3" fill="none" stroke="#2b0a3d" stroke-width="6.7" opacity="0.23"/>
    <circle cx="121.7" cy="270.4" r="144.6" fill="none" stroke="#2b0a3d" stroke-width="6.2" opacity="0.34"/>
    <circle cx="359.2" cy="550.9" r="192.4" fill="none" stroke="#2b0a3d" stroke-width="7.3" opacity="0.28"/>
    <circle cx="144.2" cy="504.5" r="182.5" fill="none" stroke="#2b0a3d" stroke-width="6.2" opacity="0.21"/>
    <circle cx="235.1" cy="434.9" r="119.8" fill="none" stroke="#2b0a3d" stroke-width="3.6" opacity="0.29"/>
    <circle cx="221.6" cy="220.3" r="152.3" fill="none" stroke="#2b0a3d" stroke-width="2.7" opacity="0.33"/>
    <circle cx="291.2" cy="278.9" r="53.7" fill="none" stroke="#2b0a3d" stroke-width="6.0" opacity="0.32"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
