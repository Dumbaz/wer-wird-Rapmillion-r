<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Eksodus von Eko Fresh">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(6 0.5 0.5)">
      <stop offset="0%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#7a00cc"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="117.4" cy="21.7" r="97.7" fill="none" stroke="#fffb00" stroke-width="3.0" opacity="0.33"/>
    <circle cx="10.9" cy="515.3" r="66.6" fill="none" stroke="#fffb00" stroke-width="8.2" opacity="0.43"/>
    <circle cx="16.5" cy="469.6" r="92.6" fill="none" stroke="#fffb00" stroke-width="6.8" opacity="0.31"/>
    <circle cx="531.2" cy="431.7" r="129.0" fill="none" stroke="#fffb00" stroke-width="6.6" opacity="0.48"/>
    <circle cx="324.2" cy="179.8" r="61.0" fill="none" stroke="#fffb00" stroke-width="4.1" opacity="0.27"/>
    <circle cx="188.4" cy="23.6" r="70.8" fill="none" stroke="#fffb00" stroke-width="5.9" opacity="0.46"/>
    <circle cx="148.9" cy="438.1" r="51.4" fill="none" stroke="#fffb00" stroke-width="7.0" opacity="0.45"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="438" width="600" height="162" fill="#000" opacity="0.58"/>
    <text x="52" y="484" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#fffb00">EKO FRESH</text>
    <text x="52" y="538" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">EKSODUS</tspan>
    </text>
    <text x="548" y="484" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2013</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#fffb00" stroke-width="6" opacity="0.9"/>
