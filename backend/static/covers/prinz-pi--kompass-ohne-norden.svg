<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Kompass ohne Norden von Prinz Pi">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(292 0.5 0.5)">
      <stop offset="0%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#7a00cc"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="336.6" cy="479.7" r="120.7" fill="none" stroke="#fffb00" stroke-width="7.3" opacity="0.42"/>
    <circle cx="15.8" cy="372.8" r="131.9" fill="none" stroke="#fffb00" stroke-width="7.9" opacity="0.47"/>
    <circle cx="130.6" cy="77.7" r="66.6" fill="none" stroke="#fffb00" stroke-width="6.0" opacity="0.46"/>
    <circle cx="319.0" cy="557.8" r="110.8" fill="none" stroke="#fffb00" stroke-width="2.9" opacity="0.50"/>
    <circle cx="404.4" cy="250.2" r="45.2" fill="none" stroke="#fffb00" stroke-width="6.8" opacity="0.22"/>
    <circle cx="378.3" cy="125.9" r="48.2" fill="none" stroke="#fffb00" stroke-width="6.7" opacity="0.42"/>
    <circle cx="275.2" cy="475.0" r="88.6" fill="none" stroke="#fffb00" stroke-width="6.3" opacity="0.18"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#fffb00">PRINZ PI</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">KOMPASS OHNE</tspan>
      <tspan x="52" dy="58">NORDEN</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2016</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#fffb00" stroke-width="6" opacity="0.9"/>
</svg>
