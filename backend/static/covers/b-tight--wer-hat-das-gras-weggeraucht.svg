      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0b3d91"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="328.1" cy="318.5" r="167.4" fill="none" stroke="#ff2e88" stroke-width="2.5" opacity="0.25"/>
    <circle cx="167.8" cy="491.2" r="109.4" fill="none" stroke="#ff2e88" stroke-width="7.6" opacity="0.42"/>
    <circle cx="344.9" cy="266.7" r="144.5" fill="none" stroke="#ff2e88" stroke-width="7.7" opacity="0.44"/>
    <circle cx="147.8" cy="200.8" r="85.5" fill="none" stroke="#ff2e88" stroke-width="7.6" opacity="0.24"/>
    <circle cx="570.8" cy="183.3" r="208.6" fill="none" stroke="#ff2e88" stroke-width="4.4" opacity="0.34"/>
    <circle cx="373.3" cy="400.1" r="51.8" fill="none" stroke="#ff2e88" stroke-width="2.2" opacity="0.36"/>
    <circle cx="515.3" cy="591.7" r="61.5" fill="none" stroke="#ff2e88" stroke-width="5.9" opacity="0.53"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ff2e88">B-TIGHT</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">WER HAT DAS GRAS</tspan>
      <tspan x="52" dy="58">WEGGERAUCHT?</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2017</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ff2e88" stroke-width="6" opacity="0.9"/>
