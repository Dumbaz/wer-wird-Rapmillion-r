<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Zum Glück in die Zukunft II von Marteria">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(5 0.5 0.5)">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#ff5f00"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="325.0" cy="390.7" r="183.2" fill="none" stroke="#2b0a3d" stroke-width="5.3" opacity="0.18"/>
    <circle cx="360.2" cy="394.5" r="76.9" fill="none" stroke="#2b0a3d" stroke-width="6.4" opacity="0.43"/>
    <circle cx="336.7" cy="144.8" r="48.3" fill="none" stroke="#2b0a3d" stroke-width="7.2" opacity="0.21"/>
    <circle cx="524.5" cy="499.4" r="90.4" fill="none" stroke="#2b0a3d" stroke-width="4.8" opacity="0.30"/>
    <circle cx="412.2" cy="500.2" r="192.7" fill="none" stroke="#2b0a3d" stroke-width="5.3" opacity="0.41"/>
    <circle cx="155.1" cy="199.1" r="90.4" fill="none" stroke="#2b0a3d" stroke-width="3.9" opacity="0.26"/>
    <circle cx="455.9" cy="179.1" r="138.5" fill="none" stroke="#2b0a3d" stroke-width="8.0" opacity="0.46"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffd200">MARTERIA</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">ZUM GLÜCK IN DIE</tspan>
      <tspan x="52" dy="58">ZUKUNFT II</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2013</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#2b0a3d" stroke-width="6" opacity="0.9"/>
</svg>
