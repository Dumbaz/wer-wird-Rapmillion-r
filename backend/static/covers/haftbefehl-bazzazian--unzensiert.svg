<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Unzensiert von Haftbefehl &amp; Bazzazian">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(200 0.5 0.5)">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#005f56"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect x="-600.0" y="-600" width="14.5" height="1800" fill="#f7ff00" opacity="0.31" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="32.1" height="1800" fill="#f7ff00" opacity="0.27" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="36.5" height="1800" fill="#f7ff00" opacity="0.34" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="35.7" height="1800" fill="#f7ff00" opacity="0.14" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="52.6" height="1800" fill="#f7ff00" opacity="0.22" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="48.9" height="1800" fill="#f7ff00" opacity="0.34" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="49.7" height="1800" fill="#f7ff00" opacity="0.18" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="14.1" height="1800" fill="#f7ff00" opacity="0.26" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="26.7" height="1800" fill="#f7ff00" opacity="0.34" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="438" width="600" height="162" fill="#000" opacity="0.58"/>
    <text x="52" y="484" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#f7ff00">HAFTBEFEHL &amp; BAZZAZIAN</text>
    <text x="52" y="538" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">UNZENSIERT</tspan>
    </text>
    <text x="548" y="484" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2015</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#f7ff00" stroke-width="6" opacity="0.9"/>
</svg>
