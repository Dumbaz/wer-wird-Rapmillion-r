    <polygon points="395.0,212.2 316.2,318.2 386.0,381.4" fill="none" stroke="#ffb800" stroke-width="4.2" opacity="0.27"/>
    <polygon points="494.7,11.9 543.6,278.0 343.0,122.2" fill="none" stroke="#ffb800" stroke-width="4.6" opacity="0.28"/>
