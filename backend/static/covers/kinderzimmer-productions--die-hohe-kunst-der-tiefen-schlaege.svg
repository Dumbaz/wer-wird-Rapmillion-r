<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Die hohe Kunst der tiefen Schläge von Kinderzimmer Productions">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(69 0.5 0.5)">
      <stop offset="0%" stop-color="#ff004d"/>
      <stop offset="100%" stop-color="#3a0a2e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="73.3" cy="289.7" r="173.0" fill="none" stroke="#ffb800" stroke-width="2.2" opacity="0.39"/>
    <circle cx="530.9" cy="569.2" r="99.4" fill="none" stroke="#ffb800" stroke-width="5.3" opacity="0.44"/>
    <circle cx="377.1" cy="373.4" r="186.3" fill="none" stroke="#ffb800" stroke-width="2.3" opacity="0.18"/>
    <circle cx="594.8" cy="195.1" r="179.5" fill="none" stroke="#ffb800" stroke-width="6.3" opacity="0.24"/>
    <circle cx="415.6" cy="228.2" r="173.5" fill="none" stroke="#ffb800" stroke-width="6.6" opacity="0.20"/>
    <circle cx="318.1" cy="378.5" r="96.1" fill="none" stroke="#ffb800" stroke-width="3.0" opacity="0.53"/>
    <circle cx="190.0" cy="511.1" r="54.9" fill="none" stroke="#ffb800" stroke-width="7.4" opacity="0.40"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="322" width="600" height="278" fill="#000" opacity="0.58"/>
    <text x="52" y="368" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#ffb800">KINDERZIMMER PRODUCTIONS</text>
    <text x="52" y="422" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">DIE HOHE KUNST</tspan>
      <tspan x="52" dy="58">DER TIEFEN</tspan>
      <tspan x="52" dy="58">SCHLÄGE</tspan>
    </text>
    <text x="548" y="368" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">1999</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ffb800" stroke-width="6" opacity="0.9"/>
</svg>
