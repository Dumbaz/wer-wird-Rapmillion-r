    <rect x="0.0" y="-600" width="34.8" height="1800" fill="#2b0a3d" opacity="0.27" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="14.7" height="1800" fill="#2b0a3d" opacity="0.33" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="41.8" height="1800" fill="#2b0a3d" opacity="0.18" transform="rotate(28 300.0 300.0)"/>
