<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Die Pfütze des Eisbergs von Dendemann">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(212 0.5 0.5)">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#ff5f00"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="399.4" cy="420.4" r="102.7" fill="none" stroke="#2b0a3d" stroke-width="2.8" opacity="0.37"/>
    <circle cx="276.6" cy="149.1" r="108.1" fill="none" stroke="#2b0a3d" stroke-width="4.9" opacity="0.18"/>
    <circle cx="136.2" cy="10.7" r="189.5" fill="none" stroke="#2b0a3d" stroke-width="6.7" opacity="0.26"/>
    <circle cx="212.3" cy="395.9" r="53.5" fill="none" stroke="#2b0a3d" stroke-width="5.2" opacity="0.49"/>
    <circle cx="118.5" cy="267.6" r="130.6" fill="none" stroke="#2b0a3d" stroke-width="6.8" opacity="0.16"/>
    <circle cx="514.4" cy="208.9" r="123.4" fill="none" stroke="#2b0a3d" stroke-width="8.1" opacity="0.33"/>
    <circle cx="384.6" cy="34.2" r="192.1" fill="none" stroke="#2b0a3d" stroke-width="7.1" opacity="0.41"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffd200">DENDEMANN</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">DIE PFÜTZE DES</tspan>
      <tspan x="52" dy="58">EISBERGS</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2006</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#2b0a3d" stroke-width="6" opacity="0.9"/>
</svg>
