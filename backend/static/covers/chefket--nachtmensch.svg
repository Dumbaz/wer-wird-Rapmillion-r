<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Nachtmensch von Chefket">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(53 0.5 0.5)">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#ff5f00"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect x="-600.0" y="-600" width="15.8" height="1800" fill="#2b0a3d" opacity="0.34" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="51.0" height="1800" fill="#2b0a3d" opacity="0.15" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="32.0" height="1800" fill="#2b0a3d" opacity="0.15" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="16.2" height="1800" fill="#2b0a3d" opacity="0.34" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="24.2" height="1800" fill="#2b0a3d" opacity="0.21" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="15.0" height="1800" fill="#2b0a3d" opacity="0.24" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="16.1" height="1800" fill="#2b0a3d" opacity="0.15" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="35.0" height="1800" fill="#2b0a3d" opacity="0.34" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="28.8" height="1800" fill="#2b0a3d" opacity="0.36" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="438" width="600" height="162" fill="#000" opacity="0.58"/>
    <text x="52" y="484" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffd200">CHEFKET</text>
    <text x="52" y="538" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">NACHTMENSCH</tspan>
    </text>
    <text x="548" y="484" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2015</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#2b0a3d" stroke-width="6" opacity="0.9"/>
</svg>
