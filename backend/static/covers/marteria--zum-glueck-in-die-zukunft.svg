<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Zum Glück in die Zukunft von Marteria">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(246 0.5 0.5)">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#005f56"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="332.6" cy="472.4" r="118.3" fill="none" stroke="#f7ff00" stroke-width="4.4" opacity="0.34"/>
    <circle cx="328.5" cy="211.0" r="135.1" fill="none" stroke="#f7ff00" stroke-width="5.6" opacity="0.53"/>
    <circle cx="345.1" cy="354.3" r="200.7" fill="none" stroke="#f7ff00" stroke-width="2.5" opacity="0.34"/>
    <circle cx="58.0" cy="467.6" r="47.9" fill="none" stroke="#f7ff00" stroke-width="8.8" opacity="0.24"/>
    <circle cx="362.7" cy="399.9" r="122.3" fill="none" stroke="#f7ff00" stroke-width="2.2" opacity="0.53"/>
    <circle cx="231.5" cy="465.3" r="196.7" fill="none" stroke="#f7ff00" stroke-width="3.3" opacity="0.54"/>
    <circle cx="250.4" cy="544.2" r="187.0" fill="none" stroke="#f7ff00" stroke-width="4.3" opacity="0.47"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#f7ff00">MARTERIA</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">ZUM GLÜCK IN DIE</tspan>
      <tspan x="52" dy="58">ZUKUNFT</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2010</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#f7ff00" stroke-width="6" opacity="0.9"/>
</svg>
