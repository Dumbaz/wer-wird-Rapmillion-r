<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Zum Glueck in die Zukunft von Marteria">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(43 0.5 0.5)">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0b3d91"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="469.3" cy="454.7" r="199.2" fill="none" stroke="#ff2e88" stroke-width="6.9" opacity="0.39"/>
    <circle cx="366.0" cy="201.3" r="162.0" fill="none" stroke="#ff2e88" stroke-width="3.2" opacity="0.18"/>
    <circle cx="373.1" cy="454.4" r="51.5" fill="none" stroke="#ff2e88" stroke-width="5.0" opacity="0.49"/>
    <circle cx="128.8" cy="400.8" r="107.7" fill="none" stroke="#ff2e88" stroke-width="8.4" opacity="0.54"/>
    <circle cx="6.6" cy="117.4" r="138.6" fill="none" stroke="#ff2e88" stroke-width="6.0" opacity="0.24"/>
    <circle cx="295.4" cy="491.5" r="173.3" fill="none" stroke="#ff2e88" stroke-width="8.8" opacity="0.30"/>
    <circle cx="171.2" cy="463.1" r="48.9" fill="none" stroke="#ff2e88" stroke-width="2.3" opacity="0.47"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ff2e88">MARTERIA</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">ZUM GLUECK IN</tspan>
      <tspan x="52" dy="58">DIE ZUKUNFT</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2010</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ff2e88" stroke-width="6" opacity="0.9"/>
</svg>
