<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Gottes Werk und Teufels Beitrag von Creutzfeld &amp; Jakob">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(93 0.5 0.5)">
      <stop offset="0%" stop-color="#8f00ff"/>
      <stop offset="100%" stop-color="#ff00c8"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <polygon points="198.1,481.9 211.5,508.4 -116.8,453.0" fill="none" stroke="#00ffe0" stroke-width="5.2" opacity="0.38"/>
    <polygon points="394.9,611.4 376.3,331.3 121.0,456.7" fill="none" stroke="#00ffe0" stroke-width="5.6" opacity="0.36"/>
    <polygon points="288.1,112.4 443.7,55.4 605.6,256.8" fill="none" stroke="#00ffe0" stroke-width="5.1" opacity="0.30"/>
    <polygon points="460.7,40.9 501.6,154.5 400.8,56.3" fill="none" stroke="#00ffe0" stroke-width="4.3" opacity="0.24"/>
    <polygon points="270.2,108.4 184.6,428.9 311.7,146.8" fill="none" stroke="#00ffe0" stroke-width="4.8" opacity="0.22"/>
    <polygon points="538.0,485.2 516.9,416.0 392.3,330.9" fill="none" stroke="#00ffe0" stroke-width="4.7" opacity="0.34"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#00ffe0">CREUTZFELD &amp; JAKOB</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">GOTTES WERK UND</tspan>
      <tspan x="52" dy="58">TEUFELS BEITRAG</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">1999</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#00ffe0" stroke-width="6" opacity="0.9"/>
