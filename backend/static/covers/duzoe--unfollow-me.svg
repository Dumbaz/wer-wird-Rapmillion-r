    <circle cx="104.2" cy="11.2" r="187.3" fill="none" stroke="#ffb800" stroke-width="4.0" opacity="0.16"/>
    <circle cx="8.7" cy="184.3" r="72.1" fill="none" stroke="#ffb800" stroke-width="7.2" opacity="0.34"/>
    <circle cx="56.2" cy="334.3" r="128.9" fill="none" stroke="#ffb800" stroke-width="8.5" opacity="0.49"/>
