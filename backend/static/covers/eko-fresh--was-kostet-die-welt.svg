<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Was kostet die Welt? von Eko Fresh">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(237 0.5 0.5)">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0b3d91"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="114.6" cy="465.5" r="79.0" fill="none" stroke="#ff2e88" stroke-width="6.9" opacity="0.42"/>
    <circle cx="214.6" cy="540.1" r="74.4" fill="none" stroke="#ff2e88" stroke-width="5.1" opacity="0.27"/>
    <circle cx="295.0" cy="19.9" r="107.5" fill="none" stroke="#ff2e88" stroke-width="6.1" opacity="0.46"/>
    <circle cx="560.9" cy="224.0" r="81.1" fill="none" stroke="#ff2e88" stroke-width="8.6" opacity="0.51"/>
    <circle cx="330.1" cy="294.6" r="79.3" fill="none" stroke="#ff2e88" stroke-width="4.2" opacity="0.23"/>
    <circle cx="521.6" cy="352.8" r="158.8" fill="none" stroke="#ff2e88" stroke-width="8.5" opacity="0.54"/>
    <circle cx="459.2" cy="295.4" r="136.1" fill="none" stroke="#ff2e88" stroke-width="6.7" opacity="0.20"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ff2e88">EKO FRESH</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">WAS KOSTET DIE</tspan>
      <tspan x="52" dy="58">WELT?</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2010</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ff2e88" stroke-width="6" opacity="0.9"/>
</svg>
