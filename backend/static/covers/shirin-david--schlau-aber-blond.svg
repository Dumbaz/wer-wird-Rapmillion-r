<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Schlau aber blond von Shirin David">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(121 0.5 0.5)">
      <stop offset="0%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#7a00cc"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="103.3" cy="187.6" r="107.4" fill="none" stroke="#fffb00" stroke-width="7.8" opacity="0.20"/>
    <circle cx="501.7" cy="552.0" r="102.2" fill="none" stroke="#fffb00" stroke-width="4.2" opacity="0.31"/>
    <circle cx="171.0" cy="375.7" r="47.3" fill="none" stroke="#fffb00" stroke-width="5.8" opacity="0.38"/>
    <circle cx="457.4" cy="408.6" r="151.6" fill="none" stroke="#fffb00" stroke-width="2.2" opacity="0.33"/>
    <circle cx="29.1" cy="255.7" r="114.0" fill="none" stroke="#fffb00" stroke-width="2.5" opacity="0.21"/>
    <circle cx="363.8" cy="90.8" r="88.0" fill="none" stroke="#fffb00" stroke-width="9.0" opacity="0.45"/>
    <circle cx="550.2" cy="418.0" r="64.3" fill="none" stroke="#fffb00" stroke-width="3.1" opacity="0.41"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#fffb00">SHIRIN DAVID</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">SCHLAU ABER</tspan>
      <tspan x="52" dy="58">BLOND</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2025</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#fffb00" stroke-width="6" opacity="0.9"/>
