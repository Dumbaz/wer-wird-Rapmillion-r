<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Orgi Pörnchen 1 Soundtrack von Frauenarzt">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(203 0.5 0.5)">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#005f56"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
