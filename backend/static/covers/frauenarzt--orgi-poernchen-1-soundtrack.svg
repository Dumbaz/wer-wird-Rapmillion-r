    <rect x="-600.0" y="-600" width="49.7" height="1800" fill="#f7ff00" opacity="0.22" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="35.8" height="1800" fill="#f7ff00" opacity="0.37" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="33.7" height="1800" fill="#f7ff00" opacity="0.37" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="25.9" height="1800" fill="#f7ff00" opacity="0.34" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="45.4" height="1800" fill="#f7ff00" opacity="0.16" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="26.4" height="1800" fill="#f7ff00" opacity="0.12" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="24.4" height="1800" fill="#f7ff00" opacity="0.32" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="27.1" height="1800" fill="#f7ff00" opacity="0.39" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="17.6" height="1800" fill="#f7ff00" opacity="0.26" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#f7ff00">FRAUENARZT</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">ORGI PÖRNCHEN 1</tspan>
      <tspan x="52" dy="58">SOUNDTRACK</tspan>
