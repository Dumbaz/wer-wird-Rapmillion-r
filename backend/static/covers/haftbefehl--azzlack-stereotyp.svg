<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Azzlack Stereotyp von Haftbefehl">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(225 0.5 0.5)">
      <stop offset="0%" stop-color="#ff004d"/>
      <stop offset="100%" stop-color="#3a0a2e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect x="-600.0" y="-600" width="21.0" height="1800" fill="#ffb800" opacity="0.30" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="53.5" height="1800" fill="#ffb800" opacity="0.13" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="33.8" height="1800" fill="#ffb800" opacity="0.12" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="29.9" height="1800" fill="#ffb800" opacity="0.25" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="26.7" height="1800" fill="#ffb800" opacity="0.23" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="17.9" height="1800" fill="#ffb800" opacity="0.12" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="47.0" height="1800" fill="#ffb800" opacity="0.16" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="38.8" height="1800" fill="#ffb800" opacity="0.20" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="36.4" height="1800" fill="#ffb800" opacity="0.24" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffb800">HAFTBEFEHL</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">AZZLACK</tspan>
      <tspan x="52" dy="58">STEREOTYP</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2010</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ffb800" stroke-width="6" opacity="0.9"/>
</svg>
