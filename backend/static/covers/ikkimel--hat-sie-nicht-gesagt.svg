      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#ff5f00"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="339.4" cy="177.4" r="45.4" fill="none" stroke="#2b0a3d" stroke-width="4.4" opacity="0.21"/>
    <circle cx="110.3" cy="422.3" r="94.8" fill="none" stroke="#2b0a3d" stroke-width="6.2" opacity="0.42"/>
    <circle cx="324.1" cy="100.2" r="164.5" fill="none" stroke="#2b0a3d" stroke-width="8.1" opacity="0.41"/>
    <circle cx="140.6" cy="593.3" r="90.1" fill="none" stroke="#2b0a3d" stroke-width="2.6" opacity="0.34"/>
    <circle cx="323.2" cy="114.7" r="125.3" fill="none" stroke="#2b0a3d" stroke-width="2.4" opacity="0.29"/>
    <circle cx="52.4" cy="23.1" r="93.5" fill="none" stroke="#2b0a3d" stroke-width="5.8" opacity="0.18"/>
    <circle cx="35.5" cy="376.1" r="40.9" fill="none" stroke="#2b0a3d" stroke-width="8.2" opacity="0.35"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
