<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Und das Geheimnis der unbeglichenen Bordellrechnung von K.I.Z &amp; Mehnersmoos">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(200 0.5 0.5)">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#ff5f00"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="282.8" cy="1.1" r="119.3" fill="none" stroke="#2b0a3d" stroke-width="5.1" opacity="0.18"/>
    <circle cx="291.4" cy="316.4" r="107.8" fill="none" stroke="#2b0a3d" stroke-width="3.8" opacity="0.44"/>
    <circle cx="511.6" cy="341.6" r="129.4" fill="none" stroke="#2b0a3d" stroke-width="2.7" opacity="0.43"/>
    <circle cx="22.3" cy="415.2" r="95.9" fill="none" stroke="#2b0a3d" stroke-width="5.8" opacity="0.36"/>
    <circle cx="219.8" cy="573.8" r="46.8" fill="none" stroke="#2b0a3d" stroke-width="2.9" opacity="0.49"/>
    <circle cx="498.6" cy="225.0" r="118.6" fill="none" stroke="#2b0a3d" stroke-width="4.5" opacity="0.38"/>
    <circle cx="514.3" cy="81.4" r="168.3" fill="none" stroke="#2b0a3d" stroke-width="4.3" opacity="0.31"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="322" width="600" height="278" fill="#000" opacity="0.58"/>
    <text x="52" y="368" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#ffd200">K.I.Z &amp; MEHNERSMOOS</text>
    <text x="52" y="422" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">UND DAS</tspan>
      <tspan x="52" dy="58">GEHEIMNIS DER</tspan>
      <tspan x="52" dy="58">UNBEGLICHENEN</tspan>
    </text>
    <text x="548" y="368" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2020</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#2b0a3d" stroke-width="6" opacity="0.9"/>
