<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Kopfnicker von Massive Töne">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(157 0.5 0.5)">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#ff5f00"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="149.0" cy="306.1" r="139.1" fill="none" stroke="#2b0a3d" stroke-width="5.5" opacity="0.30"/>
    <circle cx="25.5" cy="328.8" r="81.6" fill="none" stroke="#2b0a3d" stroke-width="6.5" opacity="0.43"/>
    <circle cx="294.7" cy="578.2" r="115.8" fill="none" stroke="#2b0a3d" stroke-width="4.7" opacity="0.18"/>
    <circle cx="406.7" cy="436.9" r="127.0" fill="none" stroke="#2b0a3d" stroke-width="5.3" opacity="0.43"/>
    <circle cx="546.6" cy="298.3" r="148.9" fill="none" stroke="#2b0a3d" stroke-width="7.5" opacity="0.17"/>
    <circle cx="379.4" cy="593.6" r="108.2" fill="none" stroke="#2b0a3d" stroke-width="3.0" opacity="0.49"/>
    <circle cx="344.7" cy="375.6" r="62.5" fill="none" stroke="#2b0a3d" stroke-width="5.1" opacity="0.36"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="438" width="600" height="162" fill="#000" opacity="0.58"/>
    <text x="52" y="484" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffd200">MASSIVE TÖNE</text>
    <text x="52" y="538" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">KOPFNICKER</tspan>
    </text>
    <text x="548" y="484" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">1996</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#2b0a3d" stroke-width="6" opacity="0.9"/>
</svg>
