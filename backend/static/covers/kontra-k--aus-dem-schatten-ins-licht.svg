    <polygon points="141.3,109.5 128.3,131.5 336.5,236.5" fill="none" stroke="#2b0a3d" stroke-width="5.2" opacity="0.20"/>
    <polygon points="371.1,216.2 99.9,31.6 375.5,213.8" fill="none" stroke="#2b0a3d" stroke-width="3.1" opacity="0.50"/>
