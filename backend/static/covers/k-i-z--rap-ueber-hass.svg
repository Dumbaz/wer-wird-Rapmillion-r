<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Rap über Hass von K.I.Z">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(32 0.5 0.5)">
      <stop offset="0%" stop-color="#8f00ff"/>
      <stop offset="100%" stop-color="#ff00c8"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect x="-600.0" y="-600" width="24.4" height="1800" fill="#00ffe0" opacity="0.30" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="23.4" height="1800" fill="#00ffe0" opacity="0.11" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="43.6" height="1800" fill="#00ffe0" opacity="0.40" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="14.9" height="1800" fill="#00ffe0" opacity="0.21" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="47.4" height="1800" fill="#00ffe0" opacity="0.18" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="39.9" height="1800" fill="#00ffe0" opacity="0.31" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="25.7" height="1800" fill="#00ffe0" opacity="0.31" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="36.4" height="1800" fill="#00ffe0" opacity="0.39" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="33.8" height="1800" fill="#00ffe0" opacity="0.34" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="438" width="600" height="162" fill="#000" opacity="0.58"/>
    <text x="52" y="484" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#00ffe0">K.I.Z</text>
    <text x="52" y="538" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">RAP ÜBER HASS</tspan>
    </text>
    <text x="548" y="484" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2021</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#00ffe0" stroke-width="6" opacity="0.9"/>
