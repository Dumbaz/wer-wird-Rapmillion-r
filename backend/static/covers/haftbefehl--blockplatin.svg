    <rect x="-600.0" y="-600" width="54.7" height="1800" fill="#fffb00" opacity="0.38" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="17.1" height="1800" fill="#fffb00" opacity="0.22" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="49.6" height="1800" fill="#fffb00" opacity="0.20" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="36.6" height="1800" fill="#fffb00" opacity="0.21" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="46.5" height="1800" fill="#fffb00" opacity="0.23" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="16.1" height="1800" fill="#fffb00" opacity="0.29" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="36.9" height="1800" fill="#fffb00" opacity="0.23" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="19.1" height="1800" fill="#fffb00" opacity="0.37" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="21.5" height="1800" fill="#fffb00" opacity="0.29" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="438" width="600" height="162" fill="#000" opacity="0.58"/>
    <text x="52" y="484" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#fffb00">HAFTBEFEHL</text>
    <text x="52" y="538" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">BLOCKPLATIN</tspan>
    </text>
    <text x="548" y="484" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2012</text>
