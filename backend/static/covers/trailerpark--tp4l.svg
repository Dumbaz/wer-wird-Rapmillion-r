    <rect x="0.0" y="-600" width="29.2" height="1800" fill="#f7ff00" opacity="0.38" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="25.6" height="1800" fill="#f7ff00" opacity="0.18" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="51.2" height="1800" fill="#f7ff00" opacity="0.12" transform="rotate(28 300.0 300.0)"/>
