    <rect x="-600.0" y="-600" width="25.7" height="1800" fill="#f7ff00" opacity="0.37" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="45.5" height="1800" fill="#f7ff00" opacity="0.38" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="22.0" height="1800" fill="#f7ff00" opacity="0.30" transform="rotate(28 300.0 300.0)"/>
