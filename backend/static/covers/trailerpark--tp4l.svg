<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="TP4L von Trailerpark">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(336 0.5 0.5)">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#005f56"/>
