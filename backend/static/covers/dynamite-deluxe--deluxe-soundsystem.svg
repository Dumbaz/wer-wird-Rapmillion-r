<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Deluxe Soundsystem von Dynamite Deluxe">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(137 0.5 0.5)">
      <stop offset="0%" stop-color="#ff004d"/>
      <stop offset="100%" stop-color="#3a0a2e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <polygon points="378.1,415.6 422.2,612.4 490.2,577.5" fill="none" stroke="#ffb800" stroke-width="5.4" opacity="0.19"/>
    <polygon points="439.5,414.2 271.7,207.5 502.1,277.1" fill="none" stroke="#ffb800" stroke-width="3.3" opacity="0.35"/>
    <polygon points="496.9,165.6 510.8,312.0 545.5,292.3" fill="none" stroke="#ffb800" stroke-width="6.3" opacity="0.39"/>
    <polygon points="538.5,127.3 678.9,4.2 496.4,71.1" fill="none" stroke="#ffb800" stroke-width="5.1" opacity="0.43"/>
    <polygon points="317.2,252.2 341.8,301.9 143.7,403.3" fill="none" stroke="#ffb800" stroke-width="7.0" opacity="0.44"/>
    <polygon points="116.6,398.4 227.9,506.0 262.4,468.2" fill="none" stroke="#ffb800" stroke-width="5.4" opacity="0.41"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffb800">DYNAMITE DELUXE</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">DELUXE</tspan>
      <tspan x="52" dy="58">SOUNDSYSTEM</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2000</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ffb800" stroke-width="6" opacity="0.9"/>
</svg>
