<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="P.Berg Battletape 3 von MC Bomber">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(338 0.5 0.5)">
      <stop offset="0%" stop-color="#8f00ff"/>
      <stop offset="100%" stop-color="#ff00c8"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect x="-600.0" y="-600" width="20.4" height="1800" fill="#00ffe0" opacity="0.25" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="39.7" height="1800" fill="#00ffe0" opacity="0.32" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="49.7" height="1800" fill="#00ffe0" opacity="0.15" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="27.0" height="1800" fill="#00ffe0" opacity="0.16" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="49.2" height="1800" fill="#00ffe0" opacity="0.28" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="52.3" height="1800" fill="#00ffe0" opacity="0.33" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="46.7" height="1800" fill="#00ffe0" opacity="0.39" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="27.5" height="1800" fill="#00ffe0" opacity="0.20" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="19.9" height="1800" fill="#00ffe0" opacity="0.33" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#00ffe0">MC BOMBER</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">P.BERG</tspan>
      <tspan x="52" dy="58">BATTLETAPE 3</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2014</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#00ffe0" stroke-width="6" opacity="0.9"/>
