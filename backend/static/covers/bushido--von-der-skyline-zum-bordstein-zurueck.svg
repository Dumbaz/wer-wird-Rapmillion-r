<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Von der Skyline zum Bordstein zurueck von Bushido">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(293 0.5 0.5)">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#ff5f00"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <polygon points="199.6,295.5 349.6,345.5 148.5,177.2" fill="none" stroke="#2b0a3d" stroke-width="5.4" opacity="0.37"/>
    <polygon points="388.2,520.1 274.3,586.4 230.5,236.7" fill="none" stroke="#2b0a3d" stroke-width="6.0" opacity="0.33"/>
    <polygon points="223.0,626.2 319.1,415.5 524.2,515.0" fill="none" stroke="#2b0a3d" stroke-width="2.5" opacity="0.21"/>
    <polygon points="648.0,284.6 458.6,233.1 489.5,42.3" fill="none" stroke="#2b0a3d" stroke-width="6.1" opacity="0.32"/>
    <polygon points="64.3,448.7 48.1,306.8 -50.0,428.7" fill="none" stroke="#2b0a3d" stroke-width="4.3" opacity="0.32"/>
    <polygon points="-131.9,233.8 -135.7,244.6 2.4,442.9" fill="none" stroke="#2b0a3d" stroke-width="6.3" opacity="0.18"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="322" width="600" height="278" fill="#000" opacity="0.58"/>
    <text x="52" y="368" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffd200">BUSHIDO</text>
    <text x="52" y="422" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">VON DER SKYLINE</tspan>
      <tspan x="52" dy="58">ZUM BORDSTEIN</tspan>
      <tspan x="52" dy="58">ZURUECK</tspan>
    </text>
    <text x="548" y="368" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2003</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#2b0a3d" stroke-width="6" opacity="0.9"/>
