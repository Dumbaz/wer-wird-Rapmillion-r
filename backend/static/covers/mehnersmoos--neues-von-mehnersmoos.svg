<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Neues von Mehnersmoos von Mehnersmoos">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(321 0.5 0.5)">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#ff5f00"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect x="-600.0" y="-600" width="54.0" height="1800" fill="#2b0a3d" opacity="0.36" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="35.8" height="1800" fill="#2b0a3d" opacity="0.19" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="35.1" height="1800" fill="#2b0a3d" opacity="0.15" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="15.1" height="1800" fill="#2b0a3d" opacity="0.11" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="30.0" height="1800" fill="#2b0a3d" opacity="0.37" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="23.8" height="1800" fill="#2b0a3d" opacity="0.22" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="46.4" height="1800" fill="#2b0a3d" opacity="0.27" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="20.0" height="1800" fill="#2b0a3d" opacity="0.11" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="19.5" height="1800" fill="#2b0a3d" opacity="0.22" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffd200">MEHNERSMOOS</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">NEUES VON</tspan>
      <tspan x="52" dy="58">MEHNERSMOOS</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2024</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#2b0a3d" stroke-width="6" opacity="0.9"/>
