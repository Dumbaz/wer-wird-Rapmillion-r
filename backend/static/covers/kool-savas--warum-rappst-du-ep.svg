<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Warum rappst du? EP von Kool Savas">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(54 0.5 0.5)">
      <stop offset="0%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#7a00cc"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect x="-600.0" y="-600" width="49.8" height="1800" fill="#fffb00" opacity="0.39" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="26.8" height="1800" fill="#fffb00" opacity="0.23" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="14.6" height="1800" fill="#fffb00" opacity="0.23" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="19.7" height="1800" fill="#fffb00" opacity="0.38" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="48.3" height="1800" fill="#fffb00" opacity="0.21" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="42.7" height="1800" fill="#fffb00" opacity="0.20" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="35.2" height="1800" fill="#fffb00" opacity="0.32" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="39.3" height="1800" fill="#fffb00" opacity="0.15" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="41.7" height="1800" fill="#fffb00" opacity="0.26" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#fffb00">KOOL SAVAS</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">WARUM RAPPST DU?</tspan>
      <tspan x="52" dy="58">EP</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2000</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#fffb00" stroke-width="6" opacity="0.9"/>
</svg>
