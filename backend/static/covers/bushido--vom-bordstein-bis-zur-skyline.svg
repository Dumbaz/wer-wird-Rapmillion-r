<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Vom Bordstein bis zur Skyline von Bushido">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(119 0.5 0.5)">
      <stop offset="0%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#7a00cc"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <polygon points="533.1,416.7 618.7,355.7 588.0,409.5" fill="none" stroke="#fffb00" stroke-width="6.8" opacity="0.28"/>
    <polygon points="166.1,36.8 217.2,151.8 9.4,11.8" fill="none" stroke="#fffb00" stroke-width="5.5" opacity="0.34"/>
    <polygon points="257.8,302.2 153.5,519.9 169.9,520.1" fill="none" stroke="#fffb00" stroke-width="4.5" opacity="0.25"/>
    <polygon points="480.6,258.6 472.1,270.5 657.4,279.9" fill="none" stroke="#fffb00" stroke-width="5.5" opacity="0.38"/>
    <polygon points="381.6,767.0 550.4,406.3 582.4,423.6" fill="none" stroke="#fffb00" stroke-width="2.3" opacity="0.34"/>
    <polygon points="552.6,488.1 410.1,648.7 504.6,377.2" fill="none" stroke="#fffb00" stroke-width="3.6" opacity="0.29"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#fffb00">BUSHIDO</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">VOM BORDSTEIN</tspan>
      <tspan x="52" dy="58">BIS ZUR SKYLINE</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2003</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#fffb00" stroke-width="6" opacity="0.9"/>
</svg>
