<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Hurra die Welt geht unter von K.I.Z">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(24 0.5 0.5)">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#005f56"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <polygon points="285.4,159.9 319.1,224.5 184.7,142.7" fill="none" stroke="#f7ff00" stroke-width="4.3" opacity="0.33"/>
    <polygon points="81.7,95.3 212.4,-23.5 104.7,5.7" fill="none" stroke="#f7ff00" stroke-width="6.0" opacity="0.49"/>
    <polygon points="149.2,65.8 202.2,363.2 229.4,138.5" fill="none" stroke="#f7ff00" stroke-width="2.2" opacity="0.23"/>
    <polygon points="511.8,-26.8 243.2,178.7 272.7,-42.6" fill="none" stroke="#f7ff00" stroke-width="6.4" opacity="0.29"/>
    <polygon points="347.3,-92.2 501.9,-30.5 522.7,41.3" fill="none" stroke="#f7ff00" stroke-width="6.5" opacity="0.21"/>
    <polygon points="246.5,573.4 144.2,689.4 6.0,565.0" fill="none" stroke="#f7ff00" stroke-width="5.5" opacity="0.44"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#f7ff00">K.I.Z</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">HURRA DIE WELT</tspan>
      <tspan x="52" dy="58">GEHT UNTER</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2015</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#f7ff00" stroke-width="6" opacity="0.9"/>
