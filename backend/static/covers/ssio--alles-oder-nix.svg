    <rect x="0.0" y="-600" width="17.4" height="1800" fill="#ffb800" opacity="0.35" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="16.6" height="1800" fill="#ffb800" opacity="0.23" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="41.4" height="1800" fill="#ffb800" opacity="0.29" transform="rotate(28 300.0 300.0)"/>
