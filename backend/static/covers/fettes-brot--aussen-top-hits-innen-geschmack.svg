<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Außen Top Hits, innen Geschmack von Fettes Brot">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(271 0.5 0.5)">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <polygon points="56.4,228.5 179.5,291.3 117.4,239.6" fill="none" stroke="#ffe600" stroke-width="5.9" opacity="0.35"/>
    <polygon points="501.8,357.7 354.8,360.2 491.6,378.5" fill="none" stroke="#ffe600" stroke-width="5.1" opacity="0.31"/>
    <polygon points="243.6,571.4 300.1,599.8 358.7,585.0" fill="none" stroke="#ffe600" stroke-width="3.7" opacity="0.19"/>
    <polygon points="124.3,-9.0 113.4,93.3 110.3,-18.2" fill="none" stroke="#ffe600" stroke-width="5.3" opacity="0.36"/>
    <polygon points="134.7,560.4 77.2,233.5 201.8,236.8" fill="none" stroke="#ffe600" stroke-width="2.0" opacity="0.47"/>
    <polygon points="143.0,194.1 39.7,133.1 54.8,217.5" fill="none" stroke="#ffe600" stroke-width="5.7" opacity="0.27"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffe600">FETTES BROT</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">AUSSEN TOP HITS,</tspan>
      <tspan x="52" dy="58">INNEN GESCHMACK</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">1996</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ffe600" stroke-width="6" opacity="0.9"/>
</svg>
