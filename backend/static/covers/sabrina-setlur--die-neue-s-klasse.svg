<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Die neue S-Klasse von Sabrina Setlur">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(311 0.5 0.5)">
      <stop offset="0%" stop-color="#ff2e88"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <polygon points="383.5,699.2 524.3,426.3 334.1,414.5" fill="none" stroke="#00f0ff" stroke-width="3.1" opacity="0.30"/>
    <polygon points="499.4,262.4 480.9,340.8 486.4,287.3" fill="none" stroke="#00f0ff" stroke-width="6.4" opacity="0.35"/>
    <polygon points="74.5,364.7 328.3,552.1 471.7,375.5" fill="none" stroke="#00f0ff" stroke-width="4.1" opacity="0.38"/>
    <polygon points="129.4,151.2 -31.9,88.2 10.3,42.3" fill="none" stroke="#00f0ff" stroke-width="6.0" opacity="0.27"/>
    <polygon points="187.7,525.3 54.9,241.6 401.3,363.9" fill="none" stroke="#00f0ff" stroke-width="6.1" opacity="0.27"/>
    <polygon points="97.6,125.9 99.7,98.2 72.8,158.7" fill="none" stroke="#00f0ff" stroke-width="4.9" opacity="0.42"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#00f0ff">SABRINA SETLUR</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">DIE NEUE</tspan>
      <tspan x="52" dy="58">S-KLASSE</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">1997</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.9"/>
</svg>
