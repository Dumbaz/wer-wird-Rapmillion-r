<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Ganz oben von K.I.Z">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(300 0.5 0.5)">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0b3d91"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect x="-600.0" y="-600" width="32.9" height="1800" fill="#ff2e88" opacity="0.38" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="34.0" height="1800" fill="#ff2e88" opacity="0.16" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="46.0" height="1800" fill="#ff2e88" opacity="0.38" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="24.1" height="1800" fill="#ff2e88" opacity="0.15" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="54.8" height="1800" fill="#ff2e88" opacity="0.33" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="33.4" height="1800" fill="#ff2e88" opacity="0.22" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="46.4" height="1800" fill="#ff2e88" opacity="0.32" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="41.9" height="1800" fill="#ff2e88" opacity="0.21" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="27.5" height="1800" fill="#ff2e88" opacity="0.23" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="438" width="600" height="162" fill="#000" opacity="0.58"/>
    <text x="52" y="484" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ff2e88">K.I.Z</text>
    <text x="52" y="538" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">GANZ OBEN</tspan>
    </text>
    <text x="548" y="484" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2013</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ff2e88" stroke-width="6" opacity="0.9"/>
</svg>
