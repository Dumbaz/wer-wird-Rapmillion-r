    <circle cx="322.9" cy="78.9" r="87.0" fill="none" stroke="#fffb00" stroke-width="5.8" opacity="0.24"/>
    <circle cx="310.2" cy="390.0" r="60.3" fill="none" stroke="#fffb00" stroke-width="5.2" opacity="0.48"/>
    <circle cx="436.4" cy="480.2" r="99.3" fill="none" stroke="#fffb00" stroke-width="3.6" opacity="0.23"/>
    <circle cx="484.9" cy="333.2" r="105.0" fill="none" stroke="#fffb00" stroke-width="2.9" opacity="0.29"/>
    <circle cx="197.8" cy="243.2" r="116.5" fill="none" stroke="#fffb00" stroke-width="2.4" opacity="0.45"/>
    <circle cx="144.5" cy="281.6" r="176.5" fill="none" stroke="#fffb00" stroke-width="7.5" opacity="0.49"/>
    <circle cx="30.5" cy="446.2" r="172.6" fill="none" stroke="#fffb00" stroke-width="7.3" opacity="0.45"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
