    <circle cx="517.6" cy="339.7" r="151.7" fill="none" stroke="#00ffe0" stroke-width="5.2" opacity="0.46"/>
    <circle cx="543.6" cy="395.3" r="129.9" fill="none" stroke="#00ffe0" stroke-width="4.1" opacity="0.32"/>
    <circle cx="459.2" cy="37.5" r="184.6" fill="none" stroke="#00ffe0" stroke-width="5.2" opacity="0.55"/>
    <circle cx="310.1" cy="594.8" r="144.9" fill="none" stroke="#00ffe0" stroke-width="8.1" opacity="0.39"/>
    <circle cx="117.0" cy="276.1" r="150.7" fill="none" stroke="#00ffe0" stroke-width="2.8" opacity="0.24"/>
    <circle cx="81.0" cy="442.7" r="64.6" fill="none" stroke="#00ffe0" stroke-width="2.7" opacity="0.27"/>
