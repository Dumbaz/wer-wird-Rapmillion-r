<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Bitte ziehen Sie durch von Deichkind">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(245 0.5 0.5)">
      <stop offset="0%" stop-color="#ff2e88"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect x="-600.0" y="-600" width="45.4" height="1800" fill="#00f0ff" opacity="0.21" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="41.2" height="1800" fill="#00f0ff" opacity="0.17" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="28.7" height="1800" fill="#00f0ff" opacity="0.20" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="21.9" height="1800" fill="#00f0ff" opacity="0.33" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="20.8" height="1800" fill="#00f0ff" opacity="0.18" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="52.1" height="1800" fill="#00f0ff" opacity="0.23" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="49.1" height="1800" fill="#00f0ff" opacity="0.11" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="51.2" height="1800" fill="#00f0ff" opacity="0.37" transform="rotate(28 300.0 300.0)"/>
    <rect x="600.0" y="-600" width="40.9" height="1800" fill="#00f0ff" opacity="0.28" transform="rotate(28 300.0 300.0)"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#00f0ff">DEICHKIND</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">BITTE ZIEHEN SIE</tspan>
      <tspan x="52" dy="58">DURCH</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2000</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.9"/>
</svg>
