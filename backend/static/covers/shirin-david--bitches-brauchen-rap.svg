<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Bitches brauchen Rap von Shirin David">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(91 0.5 0.5)">
      <stop offset="0%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#7a00cc"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="293.4" cy="577.4" r="150.8" fill="none" stroke="#fffb00" stroke-width="4.8" opacity="0.38"/>
    <circle cx="436.0" cy="266.0" r="129.2" fill="none" stroke="#fffb00" stroke-width="4.1" opacity="0.25"/>
    <circle cx="549.9" cy="582.7" r="142.4" fill="none" stroke="#fffb00" stroke-width="6.2" opacity="0.45"/>
    <circle cx="448.2" cy="294.3" r="106.6" fill="none" stroke="#fffb00" stroke-width="4.1" opacity="0.51"/>
    <circle cx="305.0" cy="232.0" r="53.8" fill="none" stroke="#fffb00" stroke-width="6.4" opacity="0.54"/>
    <circle cx="70.0" cy="152.1" r="178.1" fill="none" stroke="#fffb00" stroke-width="4.5" opacity="0.39"/>
    <circle cx="103.8" cy="258.2" r="74.8" fill="none" stroke="#fffb00" stroke-width="7.0" opacity="0.42"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#fffb00">SHIRIN DAVID</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">BITCHES BRAUCHEN</tspan>
      <tspan x="52" dy="58">RAP</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2021</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#fffb00" stroke-width="6" opacity="0.9"/>
