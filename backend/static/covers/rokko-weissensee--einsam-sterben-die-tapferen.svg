    <polygon points="414.2,380.8 402.5,97.9 131.8,335.4" fill="none" stroke="#f7ff00" stroke-width="2.1" opacity="0.31"/>
    <polygon points="439.9,203.7 613.6,-90.7 476.4,-115.1" fill="none" stroke="#f7ff00" stroke-width="6.3" opacity="0.33"/>
    <polygon points="401.4,-148.2 334.2,245.9 186.2,-21.0" fill="none" stroke="#f7ff00" stroke-width="6.7" opacity="0.49"/>
    <polygon points="706.1,159.3 610.3,390.3 596.5,392.8" fill="none" stroke="#f7ff00" stroke-width="2.0" opacity="0.20"/>
    <polygon points="74.4,25.7 224.9,162.3 130.2,-38.9" fill="none" stroke="#f7ff00" stroke-width="5.2" opacity="0.39"/>
    <polygon points="559.0,-108.8 291.4,-137.4 511.1,157.1" fill="none" stroke="#f7ff00" stroke-width="6.3" opacity="0.29"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
