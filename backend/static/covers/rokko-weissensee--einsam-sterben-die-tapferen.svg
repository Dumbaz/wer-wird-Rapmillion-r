    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">EINSAM STERBEN</tspan>
      <tspan x="52" dy="58">DIE TAPFEREN</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2021</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#f7ff00" stroke-width="6" opacity="0.9"/>
