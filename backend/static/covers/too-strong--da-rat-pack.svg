<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Da Rat Pack von Too Strong">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(285 0.5 0.5)">
      <stop offset="0%" stop-color="#ff004d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="379.4" cy="340.0" r="129.6" fill="none" stroke="#ffb800" stroke-width="4.1" opacity="0.38"/>
    <circle cx="184.9" cy="3.2" r="206.7" fill="none" stroke="#ffb800" stroke-width="3.0" opacity="0.54"/>
    <circle cx="384.8" cy="133.1" r="64.2" fill="none" stroke="#ffb800" stroke-width="3.5" opacity="0.37"/>
    <circle cx="537.0" cy="116.0" r="102.2" fill="none" stroke="#ffb800" stroke-width="4.7" opacity="0.38"/>
    <circle cx="540.1" cy="403.4" r="191.6" fill="none" stroke="#ffb800" stroke-width="2.3" opacity="0.35"/>
    <circle cx="532.6" cy="367.2" r="119.8" fill="none" stroke="#ffb800" stroke-width="8.8" opacity="0.35"/>
    <circle cx="28.0" cy="509.5" r="193.9" fill="none" stroke="#ffb800" stroke-width="4.2" opacity="0.48"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="438" width="600" height="162" fill="#000" opacity="0.58"/>
    <text x="52" y="484" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffb800">TOO STRONG</text>
    <text x="52" y="538" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">DA RAT PACK</tspan>
    </text>
    <text x="548" y="484" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">1996</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ffb800" stroke-width="6" opacity="0.9"/>
