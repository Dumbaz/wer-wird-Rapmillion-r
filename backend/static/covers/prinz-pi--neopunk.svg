    <circle cx="198.8" cy="56.1" r="94.9" fill="none" stroke="#fffb00" stroke-width="5.6" opacity="0.53"/>
    <circle cx="261.3" cy="126.5" r="71.2" fill="none" stroke="#fffb00" stroke-width="2.3" opacity="0.21"/>
    <circle cx="303.5" cy="423.1" r="200.0" fill="none" stroke="#fffb00" stroke-width="3.1" opacity="0.47"/>
    <circle cx="462.1" cy="18.3" r="62.7" fill="none" stroke="#fffb00" stroke-width="4.2" opacity="0.45"/>
    <circle cx="249.6" cy="39.8" r="199.1" fill="none" stroke="#fffb00" stroke-width="5.1" opacity="0.54"/>
    <circle cx="382.7" cy="213.3" r="105.2" fill="none" stroke="#fffb00" stroke-width="5.4" opacity="0.42"/>
    <circle cx="140.4" cy="85.3" r="136.1" fill="none" stroke="#fffb00" stroke-width="7.7" opacity="0.53"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
