    <circle cx="17.4" cy="358.5" r="133.8" fill="none" stroke="#00ffe0" stroke-width="5.1" opacity="0.48"/>
    <circle cx="261.1" cy="217.2" r="174.7" fill="none" stroke="#00ffe0" stroke-width="8.7" opacity="0.23"/>
