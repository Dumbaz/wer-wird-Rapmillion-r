<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Kapitalismus Jetzt von Hiob">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(130 0.5 0.5)">
      <stop offset="0%" stop-color="#ff004d"/>
      <stop offset="100%" stop-color="#3a0a2e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <polygon points="369.8,492.8 380.0,98.8 537.9,148.2" fill="none" stroke="#ffb800" stroke-width="5.4" opacity="0.18"/>
    <polygon points="505.4,371.5 338.6,437.2 309.9,363.5" fill="none" stroke="#ffb800" stroke-width="6.4" opacity="0.43"/>
    <polygon points="132.2,291.9 338.2,325.9 174.7,355.3" fill="none" stroke="#ffb800" stroke-width="3.7" opacity="0.18"/>
    <polygon points="129.6,346.5 373.7,451.3 116.1,352.0" fill="none" stroke="#ffb800" stroke-width="2.2" opacity="0.19"/>
    <polygon points="472.6,327.3 286.9,245.5 553.7,298.0" fill="none" stroke="#ffb800" stroke-width="2.7" opacity="0.35"/>
    <polygon points="415.3,248.0 530.0,200.8 438.8,209.9" fill="none" stroke="#ffb800" stroke-width="5.3" opacity="0.22"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffb800">HIOB</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">KAPITALISMUS</tspan>
      <tspan x="52" dy="58">JETZT</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2014</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ffb800" stroke-width="6" opacity="0.9"/>
