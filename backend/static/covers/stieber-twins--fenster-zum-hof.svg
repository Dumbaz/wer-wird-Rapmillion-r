    <polygon points="416.1,66.7 390.9,287.1 225.4,-12.0" fill="none" stroke="#ff2e88" stroke-width="6.8" opacity="0.34"/>
    <polygon points="177.2,128.0 180.1,121.7 137.9,173.8" fill="none" stroke="#ff2e88" stroke-width="5.7" opacity="0.43"/>
