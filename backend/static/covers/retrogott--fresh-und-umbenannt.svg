<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Fresh und Umbenannt von Retrogott">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(114 0.5 0.5)">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <polygon points="89.3,606.4 200.7,399.4 39.3,297.1" fill="none" stroke="#ffe600" stroke-width="6.6" opacity="0.36"/>
    <polygon points="237.3,398.9 152.1,386.7 78.6,257.3" fill="none" stroke="#ffe600" stroke-width="5.3" opacity="0.44"/>
    <polygon points="449.7,132.1 602.3,149.5 539.6,182.9" fill="none" stroke="#ffe600" stroke-width="2.1" opacity="0.48"/>
    <polygon points="178.7,432.4 313.0,495.6 258.1,562.5" fill="none" stroke="#ffe600" stroke-width="3.8" opacity="0.37"/>
    <polygon points="465.3,522.1 484.4,464.6 262.3,362.2" fill="none" stroke="#ffe600" stroke-width="5.4" opacity="0.36"/>
    <polygon points="369.1,250.1 429.0,188.2 657.4,273.3" fill="none" stroke="#ffe600" stroke-width="4.5" opacity="0.32"/>
    <rect width="600" height="600" filter="url(#grain)" opacity="0.10"/>
    <rect x="0" y="380" width="600" height="220" fill="#000" opacity="0.58"/>
    <text x="52" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#ffe600">RETROGOTT</text>
    <text x="52" y="480" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">
      <tspan x="52" dy="0">FRESH UND</tspan>
      <tspan x="52" dy="58">UMBENANNT</tspan>
    </text>
    <text x="548" y="426" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.75">2013</text>
  </g>
  <rect x="4" y="4" width="592" height="592" fill="none" stroke="#ffe600" stroke-width="6" opacity="0.9"/>
</svg>
