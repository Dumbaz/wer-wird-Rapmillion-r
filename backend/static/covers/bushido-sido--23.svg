<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="23 von Bushido &amp; Sido">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(161 0.5 0.5)">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
    <filter id="grain">
