    <rect x="-600.0" y="-600" width="31.0" height="1800" fill="#ffe600" opacity="0.18" transform="rotate(28 300.0 300.0)"/>
    <rect x="-450.0" y="-600" width="14.7" height="1800" fill="#ffe600" opacity="0.38" transform="rotate(28 300.0 300.0)"/>
    <rect x="-300.0" y="-600" width="32.7" height="1800" fill="#ffe600" opacity="0.11" transform="rotate(28 300.0 300.0)"/>
    <rect x="-150.0" y="-600" width="23.6" height="1800" fill="#ffe600" opacity="0.27" transform="rotate(28 300.0 300.0)"/>
    <rect x="0.0" y="-600" width="29.6" height="1800" fill="#ffe600" opacity="0.25" transform="rotate(28 300.0 300.0)"/>
    <rect x="150.0" y="-600" width="36.8" height="1800" fill="#ffe600" opacity="0.28" transform="rotate(28 300.0 300.0)"/>
    <rect x="300.0" y="-600" width="27.4" height="1800" fill="#ffe600" opacity="0.11" transform="rotate(28 300.0 300.0)"/>
    <rect x="450.0" y="-600" width="18.6" height="1800" fill="#ffe600" opacity="0.26" transform="rotate(28 300.0 300.0)"/>
